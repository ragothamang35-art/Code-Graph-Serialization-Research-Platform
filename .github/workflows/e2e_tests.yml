name: GraphTrust E2E Automated Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml pydantic

      - name: Run Unit Tests
        run: |
          PYTHONPATH=graphtrust/src python -m unittest graphtrust/tests/test_all.py

      - name: Run End-to-End Test Suite (Hermetic Mock Suite)
        run: |
          PYTHONPATH=graphtrust/src pytest tests/e2e -m "not real_model" -v --durations=10
